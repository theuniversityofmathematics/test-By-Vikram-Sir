<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jharkhand GK</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--text:#e6eef8}
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial; margin:0; min-height:100vh; background:linear-gradient(180deg,#071028 0%, #07121a 60%); color:var(--text); display:flex; align-items:center; justify-content:center; padding:24px}
    .container{width:100%; max-width:900px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:12px; padding:20px; box-shadow:0 8px 30px rgba(2,6,23,0.6)}
    h1{margin:0 0 14px; font-size:20px}
    .top{display:flex; justify-content:space-between; gap:12px; align-items:center}
    .sets{display:flex; gap:8px; flex-wrap:wrap}
    button.set{background:#071a2a;border:1px solid rgba(255,255,255,0.04); padding:8px 10px; border-radius:8px; color:var(--text); cursor:pointer}
    button.set.active{background:linear-gradient(90deg,#0ea5a5, #06b6d4); color:#012; font-weight:600}
    .meta{font-size:13px; opacity:0.9}

    .quiz-area{margin-top:16px}
    .qhead{display:flex; justify-content:space-between; align-items:center; gap:12px}
    .question{margin-top:12px; font-weight:600; font-size:18px}
    .options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
    .opt{padding:10px; border-radius:10px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03); cursor:pointer}
    .opt.correct{outline:3px solid rgba(34,197,94,0.25); box-shadow:0 6px 20px rgba(34,197,94,0.06)}
    .opt.wrong{outline:3px solid rgba(239,68,68,0.18); box-shadow:0 6px 20px rgba(239,68,68,0.05)}

    .controls{display:flex; justify-content:space-between; align-items:center; margin-top:16px}
    .btn{padding:8px 12px; border-radius:8px; border:none; cursor:pointer; background:var(--accent); color:#042; font-weight:600}

    /* progress bar */
    .progress-wrap{height:14px; width:100%; background:rgba(255,255,255,0.03); border-radius:12px; overflow:hidden; margin-top:14px}
    .progress{height:100%; width:100%; transition:width 0.2s linear; display:flex; align-items:center; padding-left:8px; font-size:12px; font-weight:600}

    .footer{margin-top:12px; display:flex; justify-content:flex-end; gap:10px; align-items:center}

    .result{display:none; margin-top:16px; padding:12px; border-radius:10px; background:linear-gradient(180deg, rgba(2,6,23,0.6), rgba(2,6,23,0.4))}

    .small{font-size:13px; opacity:0.9}

    @media(max-width:640px){.options{grid-template-columns:1fr} .top{flex-direction:column; align-items:stretch}}
  </style>
</head>

          <h1>Jharkhand GK</h1>

    </div>
  </div>

    // Basic app state
    let currentSet = 0; // 0-based index for tests

    let score = 0;
    const TIME_PER_Q = 20; // seconds

    let timerInterval = null;
    let locked = false; // when user chose an option

    const setsWrap = document.getElementById('sets');
    const quizArea = document.getElementById('quizArea');
    const currentSetEl = document.getElementById('currentSet');
    const qIndexEl = document.getElementById('qIndex');
    const questionText = document.getElementById('questionText');
    const optionsWrap = document.getElementById('options');
    const scoreEl = document.getElementById('score');
    const progressEl = document.getElementById('progress');
    const resultBox = document.getElementById('resultBox');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');

    // create set buttons
    for(let i=0;i<6;i++){
      const b = document.createElement('button'); b.className='set'; b.textContent=`Test ${i+1}`;
      b.addEventListener('click', ()=>{selectSet(i)});
      setsWrap.appendChild(b);
    }

    function selectSet(i){
      currentSet = i; qIndex=0; score=0; remaining=TIME_PER_Q; locked=false;
      // UI
      Array.from(document.querySelectorAll('.set')).forEach((el,idx)=> el.classList.toggle('active', idx===i));
      quizArea.style.display='block';
      currentSetEl.textContent = i+1;
      qIndexEl.textContent = qIndex+1;
      scoreEl.textContent = score;
      resultBox.style.display='none';
      renderQuestion();
      startTimer();
    }

    function renderQuestion(){
      const qobj = tests[currentSet][qIndex];
      questionText.textContent = qobj.q;
      optionsWrap.innerHTML='';
      qobj.opts.forEach((opt, idx)=>{
        const d = document.createElement('div'); d.className='opt'; d.tabIndex=0; d.textContent=opt;
        d.addEventListener('click', ()=> chooseOption(idx,d));
        d.addEventListener('keydown', (e)=>{ if(e.key==='Enter') chooseOption(idx,d); });
        optionsWrap.appendChild(d);
      });
      qIndexEl.textContent = qIndex+1;
      remaining = TIME_PER_Q; updateProgress(); locked=false;
    }

    function chooseOption(idx, el){
      if(locked) return; locked=true;
      const qobj = tests[currentSet][qIndex];
      const correct = qobj.a;
      Array.from(optionsWrap.children).forEach((c,ci)=>{
        c.classList.remove('correct','wrong');
        if(ci===correct) c.classList.add('correct');
        if(ci===idx && ci!==correct) c.classList.add('wrong');
      });
      if(idx===correct){ score++; scoreEl.textContent = score; showResult('Correct ✅'); }
      else { showResult('Wrong ❌. Correct answer highlighted'); }
      // short delay then advance
      clearInterval(timerInterval);
      setTimeout(()=>{ if(qIndex < tests[currentSet].length -1){ qIndex++; renderQuestion(); startTimer(); } else { finishTest(); } }, 900);
    }

    function showResult(msg){ resultBox.style.display='block'; resultBox.textContent = msg; }

    function startTimer(){ clearInterval(timerInterval); remaining = TIME_PER_Q; updateProgress(); timerInterval = setInterval(()=>{
      remaining -= 0.2; // smooth
      if(remaining<=0){ remaining=0; updateProgress(); clearInterval(timerInterval); handleTimeUp(); }
      else updateProgress();
    },200);
    }

    function updateProgress(){
      const pct = Math.max(0, remaining / TIME_PER_Q);
      progressEl.style.width = (pct*100) + '%';
      // compute color from green (0,255,0) -> red (255,0,0)
      const r = Math.round((1 - pct) * 255);
      const g = Math.round(pct * 255);
      progressEl.style.background = `rgb(${r},${g},16)`; // slight warm tint
      progressEl.textContent = Math.ceil(remaining) + 's';
    }

    function handleTimeUp(){ locked=true; // highlight correct
      const qobj = tests[currentSet][qIndex];
      Array.from(optionsWrap.children).forEach((c,ci)=>{ if(ci===qobj.a) c.classList.add('correct'); });
      showResult('Time up ⏱️ — Correct answer highlighted');
      setTimeout(()=>{ if(qIndex < tests[currentSet].length -1){ qIndex++; renderQuestion(); startTimer(); } else { finishTest(); } }, 900);
    }

    function finishTest(){ clearInterval(timerInterval); resultBox.style.display='block'; resultBox.innerHTML = `<strong>Test complete!</strong> Score: ${score} / ${tests[currentSet].length}`;
      // allow restart or choose another set
    }

    prevBtn.addEventListener('click', ()=>{
      if(qIndex>0){ qIndex--; renderQuestion(); startTimer(); }
    });
    nextBtn.addEventListener('click', ()=>{
      if(qIndex < tests[currentSet].length -1){ qIndex++; renderQuestion(); startTimer(); } else { finishTest(); }
    });

    restartBtn.addEventListener('click', ()=>{
      qIndex=0; score=0; scoreEl.textContent = score; renderQuestion(); startTimer(); resultBox.style.display='none';
    });
    resetAllBtn.addEventListener('click', ()=>{
      clearInterval(timerInterval); quizArea.style.display='none'; Array.from(document.querySelectorAll('.set')).forEach(el=>el.classList.remove('active'));
    });

    // Quick start: show sets and hint
    // (User must choose a test to begin.)

    // Accessibility: keyboard navigation for sets
    Array.from(document.querySelectorAll('.set')).forEach((el,idx)=> el.tabIndex=0);

    // If user wants, auto-select first test by uncommenting below:
    // selectSet(0);
  </script>
</body>
</html>

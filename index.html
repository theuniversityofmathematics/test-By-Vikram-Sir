<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Birsa Munda / Jharkhand GK </title>
  <style>
    :root{
      --bg:#f4fbf4; --card:#ffffff; --primary:#0b6f3b; --muted:#e8f1e8; --danger:#e05252;
      --glass: rgba(255,255,255,0.8);
    }
    html,body{height:100%;margin:0;padding:0;font-family: "Noto Sans Devanagari", system-ui, Arial, sans-serif;background:var(--bg);color:#0f2f11}
    .wrap{max-width:1000px;margin:18px auto;padding:16px;}
    .card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 6px 24px rgba(10,40,10,0.06);margin-bottom:14px}
    header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1{font-size:20px;margin:0;color:var(--primary)}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{padding:8px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:700}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-muted{background:var(--muted);color:#0b2f12;border:1px solid rgba(0,0,0,0.03)}
    .selector{display:flex;gap:8px;flex-wrap:wrap}
    .test-btn{padding:8px 10px;border-radius:8px;border:1px solid rgba(0,0,0,0.06);background:#fff;cursor:pointer}
    .test-btn.active{background:var(--primary);color:#fff}
    .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}
    .timer{font-weight:800;color:var(--primary)}
    .qbox{border:1px solid #eaf6ea;padding:12px;border-radius:10px;margin-top:12px;background:linear-gradient(180deg,#ffffff,#fbfff9)}
    .qtext{font-weight:700;margin-bottom:8px}
    .opts{display:grid;grid-template-columns:1fr;gap:8px}
    .opt{padding:10px;border-radius:8px;border:1px solid #e6efe6;background:#fff;cursor:pointer;transition:all .12s}
    .opt:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(10,40,10,0.04)}
    .opt.selected{background:#eafbea;border-color:#6dd070}
    .opt.correct{background:#d1f0d5;border-color:#2e9f3a}
    .opt.wrong{background:#ffdede;border-color:var(--danger)}
    .nav-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .nav-strip button{padding:6px 8px;border-radius:8px;border:1px solid #eee;background:#fafafa;cursor:pointer}
    .summary{margin-top:10px;padding:12px;background:#f8fff8;border-radius:8px;border:1px solid #e8f2e8}
    .review-item{padding:10px;border-radius:8px;margin-bottom:8px;border:1px solid #f0f0f0;background:#fff}
    .small{font-size:13px;color:#4c6b4a}
    .footer{font-size:13px;color:#556c56;margin-top:10px;text-align:center}
    @media (max-width:720px){
      h1{font-size:18px}
      .wrap{padding:10px}
      .card{padding:12px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <h1>BIRSA MUNDA TEST SERIES</h1>
        <div class="controls">
          <div class="selector" id="testSelector">
            <!-- buttons injected by JS -->
          </div>
        </div>
      </header>

      <div class="meta">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button id="startBtn" class="btn btn-primary">टेस्ट शुरू करें</button>
          <button id="reshuffleBtn" class="btn btn-muted">शफल (प्रीव्यू)</button>
          <button id="resetTimerBtn" class="btn btn-muted">टाइम रीसेट</button>
        </div>
        <div class="timer" id="timer">समय: 10:00</div>
      </div>

      <div id="container"></div>

      <div class="footer">सबमिट के बाद प्रत्येक प्रश्न के लिए आपका उत्तर और सही उत्तर दिखेगा।</div>
    </div>
  </div>

/* ============= یونیورسال कोड ============= */
const ALL_TESTS = [
  { id: 'test1', name: 'Birsa Munda Test 1', bank: TEST_1 },
  { id: 'test2', name: 'Birsa Munda Test 2', bank: TEST_2 },
  { id: 'test3', name: 'Jharkhand GK Test 3', bank: TEST_3 }
];

let currentTest = ALL_TESTS[0]; // default
let questions = []; // prepared/shuffled questions
let selected = []; // user answers per q index (null if none)
let timeLeft = 10*60;
let timerInterval = null;
let started = false;
let submitted = false;

const container = document.getElementById('container');
const timerEl = document.getElementById('timer');
const startBtn = document.getElementById('startBtn');
const reshuffleBtn = document.getElementById('reshuffleBtn');
const resetTimerBtn = document.getElementById('resetTimerBtn');
const testSelector = document.getElementById('testSelector');

/* build test selector UI */
function renderTestSelector(){
  testSelector.innerHTML = '';
  ALL_TESTS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'test-btn' + (currentTest.id===t.id ? ' active' : '');
    btn.textContent = t.name;
    btn.onclick = () => {
      if (started && !confirm('एक टेस्ट चल रहा है — क्या आप टेस्ट बदलना चाहते हैं? (चालू टेस्ट रद्द हो जाएगा)')) return;
      currentTest = t;
      renderSelectorActive();
      initAndRender();
    };
    testSelector.appendChild(btn);
  });
}
function renderSelectorActive(){
  Array.from(testSelector.children).forEach(btn => {
    btn.classList.remove('active');
    if (btn.textContent === currentTest.name) btn.classList.add('active');
  });
}

/* utilities */
function shuffleArray(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareQuestions(bank){
  // deep copy, shuffle options but keep original correct text for comparison
  const prepared = bank.map((q, idx) => {
    const origCorrectText = q.options[q.answer];
    const opts = q.options.slice();
    const shuffledOpts = shuffleArray(opts);
    const newAnswerIndex = shuffledOpts.indexOf(origCorrectText);
    return {
      id: idx+1,
      q: q.q,
      options: shuffledOpts,
      answerIndex: newAnswerIndex,
      answerText: origCorrectText
    };
  });
  return shuffleArray(prepared);
}

function initAndRender(){
  questions = prepareQuestions(currentTest.bank);
  selected = new Array(questions.length).fill(null);
  selected.__currentIndex = 0;
  timeLeft = 30*60;
  started = false;
  submitted = false;
  stopTimer();
  timerEl.textContent = formatTime(timeLeft);
  renderSelectorActive();
  renderPage();
}

function renderQuestionHTML(i){
  const qobj = questions[i];
  const optsHTML = qobj.options.map((opt, idx) => {
    const sel = selected[i] === idx ? 'selected' : '';
    return `<div class="opt ${sel}" data-q="${i}" data-opt="${idx}">${String.fromCharCode(65+idx)}. ${escapeHtml(opt)}</div>`;
  }).join('');
  return `
    <div class="qbox" data-qindex="${i}">
      <div class="qtext">${i+1}. ${escapeHtml(qobj.q)}</div>
      <div class="opts">${optsHTML}</div>
    </div>
  `;
}

function renderPage(){
  if (!started){
    container.innerHTML = `
      <div class="summary card">
        <div class="small">चयनित टेस्ट: <strong>${escapeHtml(currentTest.name)}</strong></div>
        <div style="margin-top:10px">कुल प्रश्न: <strong>${questions.length}</strong> • मोड: Learning</div>
        <div style="margin-top:10px"><em>\"टेस्ट शुरू करें\" दबाने पर टाइमर चालू होगा।</em></div>
      </div>
    `;
    return;
  }

  if (!submitted){
    const cur = selected.__currentIndex || 0;
    const qhtml = renderQuestionHTML(cur);

    const strip = questions.map((_, i) => {
      const mark = selected[i] != null ? '●' : '○';
      return `<button data-jump="${i}" class="nav-btn" style="padding:6px 8px;border-radius:8px;border:1px solid #eee;background:#fff">${i+1} ${mark}</button>`;
    }).join('');

    container.innerHTML = `
      <div>${qhtml}</div>
      <div class="nav-strip">${strip}</div>
      <div class="controls" style="margin-top:10px">
        <div>
          <button id="prev" class="btn btn-muted">पिछला</button>
          <button id="next" class="btn btn-muted">अगला</button>
        </div>
        <div>
          <button id="submit" class="btn btn-primary">जमा करें और उत्तर दिखाएँ</button>
        </div>
      </div>
      <div class="small" style="margin-top:8px">किसी भी प्रश्न संख्या बटन पर क्लिक करके सीधे उस प्रश्न पर जा सकते हैं।</div>
    `;

    // bind events
    container.querySelectorAll('.opt').forEach(el=>{
      el.addEventListener('click', ()=> {
        const qi = Number(el.getAttribute('data-q'));
        const oi = Number(el.getAttribute('data-opt'));
        selected[qi] = oi;
        selected.__currentIndex = qi;
        renderPage();
      });
    });

    container.querySelectorAll('[data-jump]').forEach(btn=>{
      btn.addEventListener('click', ()=> {
        const j = Number(btn.getAttribute('data-jump'));
        selected.__currentIndex = j;
        renderPage();
        window.scrollTo({top:0,behavior:'smooth'});
      });
    });

    document.getElementById('prev').onclick = ()=> {
      const curi = selected.__currentIndex || 0;
      if (curi>0) selected.__currentIndex = curi-1;
      renderPage();
    };
    document.getElementById('next').onclick = ()=> {
      const curi = selected.__currentIndex || 0;
      if (curi < questions.length-1) selected.__currentIndex = curi+1;
      renderPage();
    };
    document.getElementById('submit').onclick = ()=> {
      if (!confirm('क्या आप निश्चित रूप से सबमिट करना चाहते हैं? सबमिट के बाद सही/गलत दिखेगा।')) return;
      doSubmit();
    };

  } else {
    // show results & review
    let correctCount=0;
    const reviewHtml = questions.map((qobj,i)=>{
      const userIdx = selected[i];
      const userText = userIdx!=null ? qobj.options[userIdx] : null;
      const correctText = qobj.answerText;
      const isCorrect = userText === correctText;
      if (isCorrect) correctCount++;
      const optsRendered = qobj.options.map((opt, idx)=>{
        const style = opt === correctText ? 'background:#d1f0d5;border-color:#2e9f3a' : (opt === userText && !isCorrect) ? 'background:#ffdede;border-color:#e05252' : 'background:#fafafa;border-color:#eee';
        return `<div style="display:inline-block;margin:4px;padding:6px 8px;border-radius:6px;${style}">${String.fromCharCode(65+idx)}. ${escapeHtml(opt)}</div>`;
      }).join('');
      return `
        <div class="review-item">
          <div class="qtext">${i+1}. ${escapeHtml(qobj.q)}</div>
          <div class="small" style="margin-top:6px">आपका उत्तर: ${userText ? escapeHtml(userText) : '<em>अनुत्तरित</em>'}</div>
          <div class="small" style="margin-top:6px">सही उत्तर: <strong>${escapeHtml(correctText)}</strong></div>
          <div style="margin-top:8px">${optsRendered}</div>
        </div>
      `;
    }).join('');

    container.innerHTML = `
      <div class="summary card">
        <div class="score" style="font-size:18px;font-weight:800;color:var(--primary)">आपका स्कोर: ${correctCount} / ${questions.length}</div>
        <div class="small" style="margin-top:6px">सही उत्तर: <strong>${correctCount}</strong></div>
        <div style="margin-top:10px">
          <button id="retry" class="btn btn-primary">पुनः प्रयास (शफल)</button>
          <button id="viewAll" class="btn btn-muted">सभी उत्तर देखें</button>
        </div>
      </div>
      <div style="margin-top:12px">${reviewHtml}</div>
    `;

    document.getElementById('retry').onclick = ()=> {
      submitted = false;
      started = false;
      stopTimer();
      initAndRender();
    };
    document.getElementById('viewAll').onclick = ()=> window.scrollTo({top:0,behavior:'smooth'});
  }
}

function doSubmit(){
  submitted = true;
  stopTimer();
  renderPage();
}

/* timer */
function startTimer(){
  stopTimer();
  timerEl.textContent = formatTime(timeLeft);
  timerInterval = setInterval(()=>{
    timeLeft--;
    timerEl.textContent = formatTime(timeLeft);
    if (timeLeft <= 0){
      stopTimer();
      alert('समय समाप्त — उत्तर स्वतः जमा कर दिए गए हैं।');
      doSubmit();
    }
  },1000);
}
function stopTimer(){ if (timerInterval){ clearInterval(timerInterval); timerInterval = null; } }
function formatTime(sec){
  if (sec < 0) sec = 0;
  const m = Math.floor(sec/60);
  const s = sec%60;
  return `समय: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/* helpers */
function escapeHtml(str){ if (!str) return ''; return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* UI buttons */
startBtn.addEventListener('click', ()=>{
  if (!started){
    started = true;
    submitted = false;
    selected.__currentIndex = 0;
    timeLeft = 10*60;
    startTimer();
  } else {
    // focus first unanswered
    const firstUn = selected.findIndex(x=>x==null);
    selected.__currentIndex = firstUn >= 0 ? firstUn : 0;
  }
  renderPage();
});

reshuffleBtn.addEventListener('click', ()=>{
  if (started && !confirm('टेस्ट पहले से शुरू है। क्या आप शफल करके नया टेस्ट शुरू करना चाहते हैं? (मौजूदा प्रगति खो सकती है)')) return;
  questions = prepareQuestions(currentTest.bank);
  selected = new Array(questions.length).fill(null);
  selected.__currentIndex = 0;
  started = false;
  submitted = false;
  stopTimer();
  timerEl.textContent = formatTime(30*60);
  renderPage();
  alert('प्रश्न और विकल्प शफल किये गये हैं (टेस्ट अभी शुरू नहीं हुआ)।');
});

resetTimerBtn.addEventListener('click', ()=>{
  if (!started){ alert('टाइमर तभी रीसेट करें जब टेस्ट चालू हो — \"टेस्ट शुरू करें\" दबाएँ।'); return; }
  timeLeft = 10*60;
  timerEl.textContent = formatTime(timeLeft);
  alert('टाइम रीसेट हुआ।');
});

/* init */
renderTestSelector();
initAndRender();
</script>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Birsa Munda / Jharkhand GK - Multi Test </title>
  <style>
    :root{
      --bg:#f4fbf4; --card:#ffffff; --primary:#0b6f3b; --muted:#e8f1e8; --danger:#e05252;
      --soft:#f7fff7;
    }
    html,body{height:100%;margin:0;padding:0;font-family: "Noto Sans Devanagari", system-ui, Arial, sans-serif;background:var(--bg);color:#0f2f11}
    .wrap{max-width:980px;margin:14px auto;padding:14px;}
    .card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 6px 24px rgba(10,40,10,0.06);margin-bottom:12px}
    header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1{font-size:18px;margin:0;color:var(--primary)}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{padding:8px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:700}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-muted{background:var(--muted);color:#0b2f12;border:1px solid rgba(0,0,0,0.03)}
    .selector{display:flex;gap:8px;flex-wrap:wrap}
    .test-btn{padding:8px 10px;border-radius:8px;border:1px solid rgba(0,0,0,0.06);background:#fff;cursor:pointer}
    .test-btn.active{background:var(--primary);color:#fff}
    .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}
    .timer{font-weight:800;color:var(--primary)}
    .qbox{border:1px solid #eaf6ea;padding:12px;border-radius:10px;margin-top:12px;background:linear-gradient(180deg,#ffffff,#fbfff9)}
    .qtext{font-weight:700;margin-bottom:8px;font-size:16px}
    .opts{display:grid;grid-template-columns:1fr;gap:8px}
    .opt{padding:12px;border-radius:8px;border:1px solid #e6efe6;background:#fff;cursor:pointer;transition:all .12s;font-size:15px}
    .opt:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(10,40,10,0.04)}
    .opt.selected{background:#eafbea;border-color:#6dd070}
    .opt.correct{background:#d1f0d5;border-color:#2e9f3a}
    .opt.wrong{background:#ffdede;border-color:var(--danger)}
    .nav-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .nav-strip button{padding:6px 8px;border-radius:8px;border:1px solid #eee;background:#fafafa;cursor:pointer}
    .summary{margin-top:10px;padding:12px;background:#f8fff8;border-radius:8px;border:1px solid #e8f2e8}
    .review-item{padding:10px;border-radius:8px;margin-bottom:8px;border:1px solid #f0f0f0;background:#fff}
    .small{font-size:13px;color:#4c6b4a}
    .footer{font-size:13px;color:#556c56;margin-top:10px;text-align:center}
    .legend{display:flex;gap:8px;align-items:center;margin-top:8px}
    .legend div{display:flex;gap:6px;align-items:center}
    .box{width:18px;height:14px;border-radius:4px;border:1px solid #ddd}
    .box.correct{background:#d1f0d5;border-color:#2e9f3a}
    .box.wrong{background:#ffdede;border-color:var(--danger)}
    @media (max-width:780px){
      h1{font-size:16px}
      .wrap{padding:10px}
      .card{padding:12px}
      .qtext{font-size:15px}
      .opt{font-size:15px;padding:10px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <h1>Birsa Munda / Jharkhand GK — Multi Test</h1>
        <div class="controls">
          <div class="selector" id="testSelector"></div>
        </div>
      </header>

      <div class="meta">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button id="startBtn" class="btn btn-primary">Start Test</button>
          <button id="reshuffleBtn" class="btn btn-muted">Shuffle (Preview)</button>
          <button id="resetTimerBtn" class="btn btn-muted">Reset Timer</button>
        </div>
        <div class="timer" id="timer">Time: 10:00</div>
      </div>

      <div id="container"></div>

      <div class="footer">selecting an option will show correct/incorrect instantly.</div>
    </div>
  </div>

/* =========== UNIVERSAL APP LOGIC =========== */

const ALL_TESTS = [
  { id:'t1', name:'Birsa Munda Test 1', bank: TEST_1 },
  { id:'t2', name:'Birsa Munda Test 2', bank: TEST_2 },
  { id:'t3', name:'Jharkhand GK Test 3', bank: TEST_3 },
  { id:'t4', name:'Jharkhand GK Test 4', bank: TEST_4 }
];

let currentTest = ALL_TESTS[0];
let questions = [];
let selected = []; // answer index or null
let answeredLock = []; // whether question is locked after selecting (immediate feedback)
let timeLeft = 10 * 60; // 10 minutes
let timerInterval = null;
let started = false;
let submitted = false;

const container = document.getElementById('container');
const timerEl = document.getElementById('timer');
const startBtn = document.getElementById('startBtn');
const reshuffleBtn = document.getElementById('reshuffleBtn');
const resetTimerBtn = document.getElementById('resetTimerBtn');
const testSelector = document.getElementById('testSelector');

function shuffleArray(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function prepareQuestions(bank){
  const prepared = bank.map((q, idx) => {
    const origCorrectText = q.options[q.answer];
    const shuffledOpts = shuffleArray(q.options.slice());
    const newAnswerIndex = shuffledOpts.indexOf(origCorrectText);
    return {
      id: idx+1,
      q: q.q,
      options: shuffledOpts,
      answerIndex: newAnswerIndex,
      answerText: origCorrectText
    };
  });
  return shuffleArray(prepared);
}

function renderTestSelector(){
  testSelector.innerHTML = '';
  ALL_TESTS.forEach(t=>{
    const btn = document.createElement('button');
    btn.className = 'test-btn' + (currentTest.id===t.id ? ' active' : '');
    btn.textContent = t.name;
    btn.onclick = () => {
      if (started && !confirm('A test is running — change test? (current progress will be lost)')) return;
      currentTest = t;
      renderSelectorActive();
      initAndRender();
    };
    testSelector.appendChild(btn);
  });
}
function renderSelectorActive(){
  Array.from(testSelector.children).forEach(btn=>{
    btn.classList.remove('active');
    if (btn.textContent === currentTest.name) btn.classList.add('active');
  });
}

function initAndRender(){
  questions = prepareQuestions(currentTest.bank);
  selected = new Array(questions.length).fill(null);
  answeredLock = new Array(questions.length).fill(false);
  selected.__currentIndex = 0;
  timeLeft = 10 * 60;
  started = false;
  submitted = false;
  stopTimer();
  timerEl.textContent = formatTime(timeLeft);
  renderSelectorActive();
  renderPage();
}

function renderQuestionHTML(i){
  const qobj = questions[i];
  const optsHTML = qobj.options.map((opt, idx)=>{
    const selClass = selected[i] === idx ? 'selected' : '';
    return `<div class="opt ${selClass}" data-q="${i}" data-opt="${idx}">${String.fromCharCode(65+idx)}. ${escapeHtml(opt)}</div>`;
  }).join('');
  return `
    <div class="qbox" data-qindex="${i}">
      <div class="qtext">${i+1}. ${escapeHtml(qobj.q)}</div>
      <div class="opts">${optsHTML}</div>
    </div>
  `;
}

function renderPage(){
  if (!started){
    container.innerHTML = `
      <div class="summary card">
        <div class="small">Selected test: <strong>${escapeHtml(currentTest.name)}</strong></div>
        <div style="margin-top:10px">Questions: <strong>${questions.length}</strong> • Mode: Learning (Immediate feedback)</div>
        <div style="margin-top:10px"><em>Click "Start Test" to begin. Time per test: 10 minutes.</em></div>
        <div class="legend">
          <div><div class="box correct"></div> Correct</div>
          <div><div class="box wrong"></div> Wrong</div>
        </div>
      </div>
    `;
    return;
  }

  if (!submitted){
    const cur = selected.__currentIndex || 0;
    const qhtml = renderQuestionHTML(cur);

    const strip = questions.map((_, i)=>{
      const mark = selected[i] != null ? '●' : '○';
      return `<button data-jump="${i}" class="nav-btn" style="padding:6px 8px;border-radius:8px;border:1px solid #eee;background:#fff">${i+1} ${mark}</button>`;
    }).join('');

    container.innerHTML = `
      <div>${qhtml}</div>
      <div class="nav-strip">${strip}</div>
      <div class="controls" style="margin-top:10px">
        <div>
          <button id="prev" class="btn btn-muted">Previous</button>
          <button id="next" class="btn btn-muted">Next</button>
        </div>
        <div>
          <button id="submit" class="btn btn-primary">Submit & Review</button>
        </div>
      </div>
      <div class="small" style="margin-top:8px">Tap any question number to jump directly to that question.</div>
    `;

    // bind option clicks for immediate feedback
    container.querySelectorAll('.opt').forEach(el=>{
      el.addEventListener('click', (ev)=>{
        const qi = Number(el.getAttribute('data-q'));
        const oi = Number(el.getAttribute('data-opt'));
        // if already locked, ignore
        if (answeredLock[qi]) return;
        // set selection and lock
        selected[qi] = oi;
        answeredLock[qi] = true;
        // show immediate feedback visually for this question
        showImmediateFeedbackForQuestion(qi);
        // keep current index at this question
        selected.__currentIndex = qi;
        // update nav strip indicator
        renderPage();
      });
    });

    container.querySelectorAll('[data-jump]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const j = Number(btn.getAttribute('data-jump'));
        selected.__currentIndex = j;
        renderPage();
        window.scrollTo({top:0,behavior:'smooth'});
      });
    });

    document.getElementById('prev').onclick = ()=>{
      const curi = selected.__currentIndex || 0;
      if (curi>0) selected.__currentIndex = curi-1;
      renderPage();
    };
    document.getElementById('next').onclick = ()=>{
      const curi = selected.__currentIndex || 0;
      if (curi < questions.length-1) selected.__currentIndex = curi+1;
      renderPage();
    };
    document.getElementById('submit').onclick = ()=>{
      if (!confirm('Submit test now? After submit you will see review for all questions.')) return;
      doSubmit();
    };

    // After rendering, apply immediate feedback marks for questions already answered
    for (let i=0;i<questions.length;i++){
      if (answeredLock[i]) showImmediateFeedbackForQuestion(i);
    }

  } else {
    // show results & full review
    let correctCount = 0;
    const reviewHtml = questions.map((qobj,i)=>{
      const userIdx = selected[i];
      const userText = userIdx != null ? qobj.options[userIdx] : null;
      const correctText = qobj.answerText;
      const isCorrect = userText === correctText;
      if (isCorrect) correctCount++;
      const optsRendered = qobj.options.map((opt, idx)=>{
        const style = opt === correctText ? 'background:#d1f0d5;border-color:#2e9f3a' : (opt === userText && !isCorrect) ? 'background:#ffdede;border-color:#e05252' : 'background:#fafafa;border-color:#eee';
        return `<div style="display:inline-block;margin:4px;padding:6px 8px;border-radius:6px;${style}">${String.fromCharCode(65+idx)}. ${escapeHtml(opt)}</div>`;
      }).join('');
      return `
        <div class="review-item">
          <div class="qtext">${i+1}. ${escapeHtml(qobj.q)}</div>
          <div class="small" style="margin-top:6px">Your answer: ${userText ? escapeHtml(userText) : '<em>Unanswered</em>'}</div>
          <div class="small" style="margin-top:6px">Correct answer: <strong>${escapeHtml(correctText)}</strong></div>
          <div style="margin-top:8px">${optsRendered}</div>
        </div>
      `;
    }).join('');

    container.innerHTML = `
      <div class="summary card">
        <div class="score" style="font-size:18px;font-weight:800;color:var(--primary)">Your Score: ${correctCount} / ${questions.length}</div>
        <div class="small" style="margin-top:6px">Correct: <strong>${correctCount}</strong></div>
        <div style="margin-top:10px">
          <button id="retry" class="btn btn-primary">Retry (Shuffle)</button>
          <button id="viewAll" class="btn btn-muted">Scroll to Review</button>
        </div>
      </div>
      <div style="margin-top:12px">${reviewHtml}</div>
    `;
    document.getElementById('retry').onclick = ()=>{
      submitted = false;
      started = false;
      stopTimer();
      initAndRender();
    };
    document.getElementById('viewAll').onclick = ()=> window.scrollTo({top:0,behavior:'smooth'});
  }
}

function showImmediateFeedbackForQuestion(qIndex){
  // Find the question card in DOM and mark options with classes
  const qobj = questions[qIndex];
  const containerQ = container.querySelector(`[data-qindex="${qIndex}"]`);
  if (!containerQ) return;
  const opts = Array.from(containerQ.querySelectorAll('.opt'));
  opts.forEach(optEl=>{
    const oi = Number(optEl.getAttribute('data-opt'));
    optEl.classList.remove('correct','wrong','selected');
    // locked selection
    if (selected[qIndex] === oi) optEl.classList.add('selected');
    if (oi === qobj.answerIndex){
      optEl.classList.add('correct');
    } else if (selected[qIndex] === oi && oi !== qobj.answerIndex){
      optEl.classList.add('wrong');
    }
    // after marking, remove click handlers to prevent change
    optEl.style.pointerEvents = 'none';
  });
}

function doSubmit(){
  submitted = true;
  stopTimer();
  renderPage();
}

function startTimer(){
  stopTimer();
  timerEl.textContent = formatTime(timeLeft);
  timerInterval = setInterval(()=>{
    timeLeft--;
    timerEl.textContent = formatTime(timeLeft);
    if (timeLeft <= 0){
      stopTimer();
      alert('Time is up — test will be submitted automatically.');
      doSubmit();
    }
  },1000);
}
function stopTimer(){ if (timerInterval){ clearInterval(timerInterval); timerInterval = null; } }
function formatTime(sec){
  if (sec < 0) sec = 0;
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return `Time: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function escapeHtml(str){ if (!str) return ''; return (''+str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* UI Buttons */
startBtn.addEventListener('click', ()=>{
  if (!started){
    started = true;
    submitted = false;
    selected.__currentIndex = 0;
    timeLeft = 10 * 60;
    startTimer();
  } else {
    const firstUn = selected.findIndex(x=>x==null);
    selected.__currentIndex = firstUn >= 0 ? firstUn : 0;
  }
  renderPage();
});

reshuffleBtn.addEventListener('click', ()=>{
  if (started && !confirm('A test is running. Shuffle and start new test? (current progress will be lost)')) return;
  questions = prepareQuestions(currentTest.bank);
  selected = new Array(questions.length).fill(null);
  answeredLock = new Array(questions.length).fill(false);
  selected.__currentIndex = 0;
  started = false;
  submitted = false;
  stopTimer();
  timeLeft = 10 * 60;
  timerEl.textContent = formatTime(timeLeft);
  renderPage();
  alert('Questions and options have been shuffled (test not started). Press Start Test to begin.');
});

resetTimerBtn.addEventListener('click', ()=>{
  if (!started){ alert('Timer can be reset only when test has started. Press Start Test.'); return; }
  timeLeft = 10 * 60;
  timerEl.textContent = formatTime(timeLeft);
  alert('Timer has been reset to 10:00.');
});

/* init */
renderTestSelector();
initAndRender();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>बिरसा मुंडा</title>
  <style>
    body{font-family: "Noto Sans Devanagari", system-ui, Arial, sans-serif; background:#f3f7f3; margin:0; padding:20px;}
    .wrap{max-width:900px;margin:0 auto;background:#fff;padding:22px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,0.08);}
    h1{text-align:center;margin:0 0 10px;color:#0b5a2b;}
    .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px;flex-wrap:wrap}
    .timer{font-weight:700;color:#1b5b1b}
    .qbox{border:1px solid #e6eee6;padding:14px;border-radius:10px;margin-bottom:12px;background:#fcfffc}
    .qtext{font-weight:700;margin-bottom:8px}
    .opts{display:grid;grid-template-columns:1fr;gap:8px}
    .opt{padding:10px;border-radius:8px;border:1px solid #dfefe0;background:#fff;cursor:pointer}
    .opt:hover{background:#f0fff0}
    .opt.selected{background:#dff4d9;border-color:#7fd07d}
    .opt.correct{background:#d1f0d5;border-color:#2e9f3a}
    .opt.wrong{background:#ffdede;border-color:#e05252}
    .controls{display:flex;justify-content:space-between;margin-top:12px;gap:8px}
    button{padding:10px 14px;border-radius:8px;border:0;cursor:pointer;font-weight:700}
    .btn-primary{background:#0b6f3b;color:#fff}
    .btn-muted{background:#e6e6e6;color:#333}
    .summary{margin-top:14px;padding:12px;background:#f9fff9;border-radius:10px;border:1px solid #e6f2e6}
    .review-item{padding:10px;border-radius:8px;margin-bottom:8px;border:1px solid #eee;background:#fff}
    .small{font-size:13px;color:#555}
    .top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .score{font-size:18px;font-weight:800;color:#0b5a2b}
    .note{font-size:13px;color:#666;margin-top:8px}
    @media (max-width:600px){ .meta{flex-direction:column;align-items:flex-start} .controls{flex-direction:column} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>बिरसा मुंडा</h1>

    <div class="meta">
      <div class="top-actions">
        <button id="startBtn" class="btn-primary">टेस्ट शुरू करें</button>
        <button id="reshuffleBtn" class="btn-muted">शफल प्रश्न (पूर्वावलोकन)</button>
        <button id="resetTimerBtn" class="btn-muted">टाइम रीसेट</button>
      </div>
      <div class="timer" id="timer">समय: 10:00</div>
    </div>

    <div id="container"></div>

    <div class="note">
      निर्देश:  सबमिट करने के बाद प्रत्येक प्रश्न के लिए आपका उत्तर और सही उत्तर दिखेगा। आप पुनः प्रयास कर सकते हैं।
    </div>
  </div>

  <script>
/* =========================
   
   हर ऑब्जेक्ट: { q: 'प्रश्न', options: [...], answer: index_of_correct_in_options_initial }
   ========================= */

{ q: "बिरसा मुंडा के जीवन पर कौन-सा भाव सबसे अधिक लिया जाता है?", options: ["बलिदान और नेतृत्व", "व्यापार कौशल", "वैज्ञानिक प्रयोग", "कला और संगीत"], answer: 0 },
{ q: "बिरसा मुंडा के संघर्ष को हम किस धार्मिक/सामाजिक संदर्भ में भी देख सकते हैं?", options: ["आदिवासी समाज की सांस्कृतिक-धार्मिक पुनरुत्थान कथा", "वैज्ञानिक धर्म", "नवउदार समाजवाद", "सभ्यतावाद"], answer: 0 }
];

/* ======== यांत्रिकी (shuffle, UI, state) ======== */
let questions = []; // shuffled copy with option texts adjusted
let selected = [];  // user selected option index per question (null if none)
const TOTAL_TIME = 10 * 60; // seconds
let timeLeft = TOTAL_TIME;
let timerInterval = null;
let started = false;
let submitted = false;

const container = document.getElementById('container');
const timerEl = document.getElementById('timer');
const startBtn = document.getElementById('startBtn');
const reshuffleBtn = document.getElementById('reshuffleBtn');
const resetTimerBtn = document.getElementById('resetTimerBtn');

function shuffleArray(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function prepareQuestions() {
  // create deep copy and store correct answer text to compare after shuffling options
  const prepared = QUESTION_BANK.map((q, idx) => {
    const origCorrectText = q.options[q.answer];
    const opts = q.options.slice();
    const shuffledOpts = shuffleArray(opts);
    const newAnswerIndex = shuffledOpts.indexOf(origCorrectText);
    return {
      id: idx + 1,
      q: q.q,
      options: shuffledOpts,
      answerIndex: newAnswerIndex,
      answerText: origCorrectText
    };
  });
  // shuffle question order as well
  questions = shuffleArray(prepared);
  selected = new Array(questions.length).fill(null);
}

function renderQuestion(i) {
  const qobj = questions[i];
  return `
    <div class="qbox" data-qindex="${i}">
      <div class="qtext">${i+1}. ${escapeHtml(qobj.q)}</div>
      <div class="opts">
        ${qobj.options.map((opt, idx) => {
          const sel = selected[i] === idx ? 'selected' : '';
          return `<div class="opt ${sel}" data-opt="${idx}" data-q="${i}">${String.fromCharCode(65+idx)}. ${escapeHtml(opt)}</div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function renderPage() {
  if (!started) {
    container.innerHTML = `
      <div class="summary">
        <div class="small">कुल प्रश्न: <strong>${questions.length}</strong> • मोड: Learning</div>
        <div style="margin-top:10px">जब आप <strong>\"टेस्ट शुरू करें\"</strong> दबायेंगे तो प्रश्न व विकल्प रैन्डम होंगे और टाइमर चालू होगा।</div>
      </div>
    `;
    return;
  }

  if (!submitted) {
    // show one question at a time with navigation and question index strip
    const qIndex = selected.__currentIndex ?? 0;
    const qhtml = renderQuestion(qIndex);

    // question navigation strip
    const strip = questions.map((_, i) => {
      const filled = selected[i] != null ? '●' : '○';
      return `<button data-jump="${i}" class="btn-muted" style="padding:6px;border-radius:6px;border:1px solid #eee;margin:2px;font-weight:700">${i+1} ${filled}</button>`;
    }).join('');

    container.innerHTML = `
      <div>${qhtml}</div>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">${strip}</div>
      <div class="controls">
        <div>
          <button id="prev" class="btn-muted">पिछला</button>
          <button id="next" class="btn-muted">अगला</button>
        </div>
        <div>
          <button id="submit" class="btn-primary">जमा करें और उत्तर दिखाएँ</button>
        </div>
      </div>
      <div class="small" style="margin-top:8px">आप किसी भी समय प्रश्न संख्या बटन दबाकर उस प्रश्न पर जा सकते हैं।</div>
    `;

    // attach events
    container.querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', (ev) => {
        const qi = Number(el.getAttribute('data-q'));
        const oi = Number(el.getAttribute('data-opt'));
        selected[qi] = oi;
        // remember current visible question index
        selected.__currentIndex = qi;
        renderPage();
      });
    });

    container.querySelectorAll('[data-jump]').forEach(btn => {
      btn.addEventListener('click', () => {
        const j = Number(btn.getAttribute('data-jump'));
        selected.__currentIndex = j;
        renderPage();
      });
    });

    document.getElementById('prev').onclick = () => {
      const cur = selected.__currentIndex || 0;
      if (cur > 0) selected.__currentIndex = cur - 1;
      renderPage();
    };
    document.getElementById('next').onclick = () => {
      const cur = selected.__currentIndex || 0;
      if (cur < questions.length - 1) selected.__currentIndex = cur + 1;
      renderPage();
    };
    document.getElementById('submit').onclick = () => {
      if (!confirm('क्या आप निश्चित रूप से सबमिट करना चाहते हैं? सबमिट के बाद सही उत्तर दिखेगा।')) return;
      doSubmit();
    };
  } else {
    // Show results & review (learning)
    let correctCount = 0;
    const reviewHtml = questions.map((qobj, i) => {
      const userIdx = selected[i];
      const userText = userIdx != null ? qobj.options[userIdx] : null;
      const correctIdx = qobj.answerIndex;
      const correctText = qobj.answerText;
      const isCorrect = userText === correctText;
      if (isCorrect) correctCount++;
      return `
        <div class="review-item">
          <div class="qtext">${i+1}. ${escapeHtml(qobj.q)}</div>
          <div class="small">आपका उत्तर: ${userText ? escapeHtml(userText) : '<em>अनुत्तरित</em>'}</div>
          <div class="small" style="margin-top:6px">सही उत्तर: <strong>${escapeHtml(correctText)}</strong></div>
          <div style="margin-top:8px">
            ${qobj.options.map((opt, idx) => {
              const cls = (opt === correctText) ? 'opt correct' : (opt === userText && !isCorrect) ? 'opt wrong' : 'opt';
              return `<div style="display:inline-block;margin:4px;padding:6px 8px;border-radius:6px;border:1px solid #eee;${cls.includes('correct')? 'background:#d1f0d5;border-color:#2e9f3a' : cls.includes('wrong') ? 'background:#ffdede;border-color:#e05252' : 'background:#fafafa'}">${String.fromCharCode(65+idx)}. ${escapeHtml(opt)}</div>`;
            }).join('')}
          </div>
        </div>
      `;
    }).join('');

    container.innerHTML = `
      <div class="summary">
        <div class="score">आपका स्कोर: ${correctCount} / ${questions.length}</div>
        <div class="small" style="margin-top:6px">(सही उत्तर: <strong>${correctCount}</strong>)</div>
        <div style="margin-top:10px">
          <button id="retry" class="btn-primary">पुनः प्रयास (शफल)</button>
          <button id="viewAll" class="btn-muted">प्रश्न सूची देखें</button>
        </div>
      </div>
      <div style="margin-top:12px">${reviewHtml}</div>
    `;

    document.getElementById('retry').onclick = () => {
      submitted = false;
      started = false;
      stopTimer();
      initAndRender();
    };
    document.getElementById('viewAll').onclick = () => {
      // scroll to top (already shows all)
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  }
}

function doSubmit() {
  submitted = true;
  stopTimer();
  renderPage();
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* Timer functions */
function startTimer() {
  stopTimer();
  timeLeft = TOTAL_TIME;
  timerEl.textContent = formatTime(timeLeft);
  timerInterval = setInterval(() => {
    timeLeft--;
    timerEl.textContent = formatTime(timeLeft);
    if (timeLeft <= 0) {
      stopTimer();
      alert('समय समाप्त — अब उत्तर स्वतः जमा किये जा रहे हैं।');
      doSubmit();
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function formatTime(sec) {
  if (sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `समय: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/* Initialize and bind buttons */
function initAndRender() {
  prepareQuestions();
  // set default current index to 0
  selected.__currentIndex = 0;
  started = false;
  submitted = false;
  timerEl.textContent = formatTime(TOTAL_TIME);
  renderPage();
}

// Start button behaviour
startBtn.addEventListener('click', () => {
  if (!started) {
    started = true;
    submitted = false;
    selected.__currentIndex = 0;
    startTimer();
  } else {
    // if already started, focus first unanswered
    const firstUn = selected.findIndex(x => x == null);
    selected.__currentIndex = firstUn >= 0 ? firstUn : 0;
  }
  renderPage();
});

// Reshuffle preview - prepare new shuffle but do not start timer
reshuffleBtn.addEventListener('click', () => {
  prepareQuestions();
  selected.__currentIndex = 0;
  started = false;
  submitted = false;
  stopTimer();
  renderPage();
  alert('प्रश्न और विकल्प शफल किए गए हैं (टेस्ट अभी शुरू नहीं हुआ)। यदि आप शुरू करना चाहें तो \"टेस्ट शुरू करें\" दबाएँ।');
});

// Reset timer (only when running)
resetTimerBtn.addEventListener('click', () => {
  if (!started) {
    alert('टेस्ट अभी शुरू नहीं हुआ — \"टेस्ट शुरू करें\" दबाएँ।');
    return;
  }
  timeLeft = TOTAL_TIME;
  timerEl.textContent = formatTime(timeLeft);
  alert('टाइम रीसेट किया गया।');
});

/* prepare first time */
initAndRender();
  </script>
